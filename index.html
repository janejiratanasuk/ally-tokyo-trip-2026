<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Mali", "Leelawadee UI", sans-serif; color: #3A3355;
    display: grid; place-items: center; padding: 20px;
    background: #FFF7F2;
    background-image: radial-gradient(circle at 10% 0%, #FFE3EC 0, transparent 45%), radial-gradient(circle at 100% 30%, #EDE6FF 0, transparent 40%), radial-gradient(circle at 30% 100%, #E3F1FF 0, transparent 40%);
  }
  .card { width: 100%; max-width: 360px; background: #fff; border-radius: 28px; padding: 28px 22px 22px; text-align: center;
          box-shadow: 0 10px 30px rgba(122, 92, 140, .15); }
  .logo { width: 86px; height: 86px; margin: 0 auto 10px; border-radius: 26px; display: grid; place-items: center; font-size: 46px;
          background: linear-gradient(135deg, #F7A8C0, #C9B3FF 60%, #A7D3F5); box-shadow: 0 8px 20px rgba(231, 127, 160, .35); }
  h1 { font-size: 22px; margin: 6px 0 2px; }
  p { margin: 0 0 18px; color: #8A84A3; font-size: 14px; }
  .field { position: relative; }
  input[type=password], input[type=text] {
    width: 100%; font-family: inherit; font-size: 17px; padding: 14px 48px 14px 16px; border-radius: 16px;
    border: 2px solid #F1E6EC; outline: none; background: #FFFAFC; color: #3A3355; transition: border-color .2s;
  }
  input:focus { border-color: #F7A8C0; }
  .eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: none; background: none; font-size: 20px; cursor: pointer; padding: 6px; }
  label.rem { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13.5px; color: #8A84A3; margin: 12px 0 14px; cursor: pointer; }
  label.rem input { width: 18px; height: 18px; accent-color: #E77FA0; }
  button.go { width: 100%; border: none; font-family: inherit; font-size: 17px; font-weight: 700; color: #fff; padding: 14px; border-radius: 16px; cursor: pointer;
              background: linear-gradient(135deg, #F28BA8, #B9A8F5); box-shadow: 0 8px 18px rgba(231, 127, 160, .35); }
  button.go:disabled { opacity: .7; }
  .err { color: #E05A7E; font-size: 14px; min-height: 22px; margin-top: 10px; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .foot { margin-top: 14px; font-size: 12px; color: #B5AFC9; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="logo">🗻</div>
  <h1>Tokyo &amp; Fuji Trip</h1>
  <p>2–8 ธ.ค. 2569 · ใส่รหัสเพื่อเข้าดูแผนเที่ยว 🌸</p>
  <div class="field">
    <input id="pw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" autofocus>
    <button type="button" class="eye" id="eye" aria-label="แสดงรหัส">👀</button>
  </div>
  <label class="rem"><input type="checkbox" id="rem" checked> จำรหัสในเครื่องนี้</label>
  <button class="go" id="go" type="submit">เข้าสู่ทริป ✈️</button>
  <div class="err" id="err"></div>
  <div class="foot">🔒 เนื้อหาถูกเข้ารหัส เปิดได้เฉพาะคนที่มีรหัส</div>
</form>

const KEY = "tokyoTripPw";
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  del() { try { localStorage.removeItem(KEY); } catch (e) {} }
};
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(DATA.s), iterations: DATA.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(DATA.i) }, key, b(DATA.c));
  return new TextDecoder().decode(plain);
}
function open(html, pw) { window.__TRIP_PW = pw; window.__TRIP_APP = html; document.open(); document.write(html); document.close(); }

const f = document.getElementById("f"), pw = document.getElementById("pw"), err = document.getElementById("err"), go = document.getElementById("go");
document.getElementById("eye").onclick = () => { pw.type = pw.type === "password" ? "text" : "password"; };
f.onsubmit = async (e) => {
  e.preventDefault();
  if (!pw.value) { err.textContent = "กรุณาใส่รหัสก่อนนะ"; return; }
  go.disabled = true; go.textContent = "กำลังเปิด... 🔓"; err.textContent = "";
  try {
    const html = await unlock(pw.value);
    if (document.getElementById("rem").checked) store.set(pw.value); else store.del();
    open(html, pw.value);
  } catch (x) {
    err.textContent = "รหัสไม่ถูกต้อง ลองใหม่อีกครั้งนะ 🥲";
    f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
    go.disabled = false; go.textContent = "เข้าสู่ทริป ✈️"; pw.select();
  }
};
(async () => {
  const saved = store.get();
  if (!saved) return;
  try { open(await unlock(saved), saved); } catch (x) { store.del(); }
})();
})();
